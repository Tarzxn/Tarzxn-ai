services:
  - type: web
    name: forge-ollama-cloud
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 300 --workers 2 --worker-class gthread --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OLLAMA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FORGE_USERNAME
        sync: false
      - key: FORGE_PASSWORD
        sync: false
      - key: FORGE_SIGNUP_CODE
        sync: false
    disk:
      name: forge-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
